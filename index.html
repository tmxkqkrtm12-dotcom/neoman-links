function filt(q, go2) {
  q = q.trim().replace(/\s+/g, ""); { const mm = /^(?:no\.?|#|번호)?(\d+)(?:번째|번|호)?\.?$/i.exec(q); if (mm) q = mm[1]; }  // 11/19 사장 "80번을 치면 안나와": 80번, #80, 80호도 번호로
  if (/^\d+$/.test(q)) { const el = document.getElementById("n" + q); document.querySelectorAll("#app .hide").forEach(x => x.classList.remove("hide")); if (el) { if (go2 || q.length >= 1) { el.scrollIntoView({behavior:"smooth", block:"center"}); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 2000); } sMsg.innerHTML = q + "번 찾았어요"; } else { sMsg.innerHTML = ENDED[q] ? `${q}번은 ${ENDED[q]}이라 끝났어요. 위 '이번 주 느루 픽'을 봐요` : q + "번은 아직 없어요"; } return; }
  let n = 0;
  document.querySelectorAll("#app section").forEach(sec => {
    const items = sec.querySelectorAll("a.item");
    if (!q) { sec.classList.remove("hide"); items.forEach(i => i.classList.remove("hide")); return; }
    let shown = 0;
    items.forEach(i => { const t = [...i.querySelectorAll(".name,.who")].map(x => x.textContent).join("").replace(/\s+/g, ""); const ok = t.includes(q); i.classList.toggle("hide", !ok); if (ok) shown++; });
    sec.classList.toggle("hide", shown === 0);
    n += shown;
  });
  if (go2 && q && n) { const f = document.querySelector("#app a.item:not(.hide)"); if (f) f.scrollIntoView({behavior: "smooth", block: "center"}); }
  sMsg.innerHTML = !q ? "" : n ? `${n}개 찾았어요` : `'${esc(q)}' 물건은 여기엔 아직 없어요.<br>위 버튼 물건은 바로 있어요. <a href="https://cshop.naver.com/neoman_molla/products" target="_blank" rel="noopener">느루가 낋여온 특가 할인 템에서 더 찾아보기 ›</a>`;
}
