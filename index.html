let sT; sIn.addEventListener("input", () => { clearTimeout(sT); sT = setTimeout(() => filt(sIn.value), /^\s*(?:#|번호)?\s*\d+\s*(?:번째|번|호)?\s*$/.test(sIn.value) ? 600 : 150); });  // 11/18 사장 '76이 없어': 번호를 치는 중 7에서 먼저 움직여 76까지 못 감 → 다 친 뒤 한 번만
sIn.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); sIn.blur(); filt(sIn.value, true); } });
document.getElementById("chips").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; sIn.value = b.textContent; filt(b.textContent, true); });
document.getElementById("find").addEventListener("submit", e => { e.preventDefault();
  const el = document.getElementById("n" + document.getElementById("q").value.trim());
  if (!el) { alert(ENDED[document.getElementById("q").value.trim()] ? "그 번호는 끝난 선물이에요" : "그 번호는 아직 없어요"); return; }
  if (sIn.value) { sIn.value = ""; filt(""); }
  el.scrollIntoView({behavior:"smooth", block:"center"}); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 2000); });
// 11/19 본부: 주소 끝 #n15 처럼 번호를 붙이면 그 물건으로 바로 이동(노션 자료에서 번호 링크용)
function goHash(){const m=/^#n(\d+)$/.exec(location.hash);if(!m)return;const el=document.getElementById("n"+m[1]);if(!el)return;el.scrollIntoView({block:"center"});el.style.outline="4px solid #F26B1D";el.style.borderRadius="12px";setTimeout(()=>{el.style.outline=""},4000)}
window.addEventListener("hashchange",goHash);window.addEventListener("load",()=>setTimeout(goHash,300));
</script>
