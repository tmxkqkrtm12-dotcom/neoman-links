<style>
:root{

}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);

.wrap{max-width:560px;margin:0 auto;padding:10px 16px 56px}
.hero{display:flex;align-items:center;gap:14px}
.face{flex:none;width:80px;height:80px;border-radius:50%;object-fit:cover;border:4px solid #fff;

h1{font-size:28px;line-height:1.2;margin:0 0 2px;letter-spacing:-.5px}
.bio{color:var(--sub);font-size:19px;margin:0;line-height:1.4;font-weight:600}
.notice{margin:8px 0 0;color:var(--sub);font-size:16px;line-height:1.5}
.pick{margin-top:10px;padding:10px 14px 12px;background:#fff;border:2px solid var(--line);border-radius:16px}
.pick-q{margin:0 0 6px;font-size:20px;font-weight:900;line-height:1.35}
.nums{display:flex;flex-wrap:wrap;gap:10px}
.nums button{font:inherit;font-size:24px;font-weight:900;min-width:64px;height:54px;padding:0 14px;border:0;
  border-radius:14px;background:var(--ink);color:#fff;cursor:pointer}
.nums button:active{transform:translateY(2px)}
.find-msg{margin:10px 0 0;font-size:19px;font-weight:800;color:var(--accent-dark)}
.find-msg:empty{display:none}
section{margin-top:16px}
.sec-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:8px}
h2{font-size:24px;line-height:1.3;margin:0;letter-spacing:-.4px}
.badge{flex:none;font-size:17px;font-weight:800;color:#fff;background:#2F6B3F;padding:4px 12px;border-radius:999px}
.badge.gray{background:#6F6458}
.item{background:var(--card);border:2px solid var(--line);border-radius:20px;overflow:hidden;
  margin-bottom:16px;padding:12px 14px 14px;scroll-margin-top:20px}
.item.flash{outline:5px solid var(--accent);outline-offset:3px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.num{font-size:23px;font-weight:900;color:#fff;background:var(--ink);padding:2px 12px;border-radius:12px;line-height:1.4}
.ep{font-size:19px;font-weight:800;color:var(--tag-ink);background:var(--tag);padding:3px 11px;border-radius:10px}
.found{display:none;font-size:19px;font-weight:900;color:#fff;background:var(--accent);padding:3px 11px;border-radius:10px}
.item.flash .found{display:inline-block}
.scene{margin:8px 0 0;font-size:21px;font-weight:700;color:var(--ink);line-height:1.45;

.goods{display:block;margin-top:10px;color:inherit;text-decoration:none}
.pic{width:100%;aspect-ratio:2/1;border-radius:14px;overflow:hidden;background:#fff}
.pic img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.pic.hold{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;

.pic.hold b{font-size:21px}
.pic.hold span{font-size:18px;font-weight:700}
.title{font-size:24px;font-weight:900;line-height:1.3;margin:8px 0 0}
.why{font-size:21px;font-weight:700;color:#7C2D12;margin:4px 0 0;line-height:1.4}
.name{font-size:18px;font-weight:600;color:var(--sub);margin:4px 0 0;line-height:1.4}

a.buy{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 var(--accent-dark)}

details.pick summary::-webkit-details-marker{display:none}
details.pick summary:after{content:" 열기 ▾";color:var(--accent-dark)}
details.pick[open] summary:after{content:" 닫기 ▴"}
.rate{font-size:19px;font-weight:800;color:#1F5130;margin:6px 0 0}
.wello-note{margin:28px 0 0;color:var(--sub);font-size:17px;line-height:1.5;text-align:center}
</style>
</head>

</div>

      title:"말순 여사가 반찬 담는 통", why:"뚜껑 네 귀를 딸깍 눌러 꽉 닫아요", name:"락앤락 클래식 밀폐용기", link:"https://link.coupang.com/a/iziume2otE", img:"n1.jpg" }
  ]}
];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const isUrl = v => /^https:\/\//.test(v || "");
const shown = it => it.link !== "없음";
// 분류(사장 말 11/17 '시니어 엄청 쉽게', 벤치 hq\리서치\극장모음_시니어쇼핑_벤치_1117.md). 새 물건은 번호를 여기 분류에도 넣는다.
const CATS = {"먹는 것": [21, 22, 27, 30, 31], "바르고 씻는 것": [19, 20, 23, 24, 26, 28], "걷고 신고 따뜻한 것": [7, 8, 15, 16, 17, 29], "집안과 생활": [1, 4, 5, 6, 9, 10, 11, 12, 25]};
// 쿠팡 별점과 리뷰 수(쿠팡 파트너스 화면 값, 기준일 RATE_DAY). 지어내지 않는다. 없으면 줄을 안 보인다.
const RATE_DAY = "11/17";
const RATE = {"1": [4.5, 289], "4": [4.5, 18518], "5": [4, 1284], "6": [4.5, 127], "8": [4.5, 1874], "9": [5, 51], "11": [4.5, 262], "12": [4.5, 30055], "15": [5, 2093], "16": [4.5, 380], "19": [5, 93065], "20": [4.5, 394], "21": [5, 132529], "22": [5, 76807], "23": [4.5, 1994], "24": [5, 242488], "25": [5, 20374], "26": [5, 147561], "27": [5, 101402], "28": [5, 571], "30": [5, 294367]};
const alias = {}, later = {}, chips = [], byN = {};
for (const sec of SECTIONS) for (const it of sec.items) {
  if (!shown(it)) { later[it.n] = it.title; continue; }
  byN[it.n] = Object.assign({sec: sec.title}, it);
}
let h = "", nav = "", k = 0;
const used = new Set();
for (const [cat, ns] of Object.entries(CATS)) {
  const items = ns.map(n => byN[n]).filter(Boolean).sort((a, b) => b.n - a.n);
  if (!items.length) continue;
  k++;
  nav += `<a href="#c${k}">${esc(cat)}</a>`;
  h += `<section id="c${k}"><div class="sec-head"><h2>${esc(cat)}</h2><span class="badge">${items.length}가지</span></div><div class="grid">`;
  for (const it of items) { used.add(it.n); h += card(it); }
  h += `</div></section>`;
}
const rest = Object.values(byN).filter(it => !used.has(it.n)).sort((a, b) => b.n - a.n);
if (rest.length) {
  k++; nav += `<a href="#c${k}">그 밖의 물건</a>`;
  h += `<section id="c${k}"><div class="sec-head"><h2>그 밖의 물건</h2></div><div class="grid">${rest.map(card).join("")}</div></section>`;
}
document.getElementById("cats").innerHTML = nav;
function card(it) {
  const nums = [it.n, ...(it.also || [])];
  for (const a of nums) { alias[a] = it.n; chips.push(a); }
  const live = isUrl(it.link);
  const pic = it.img
    ? `<div class="pic"><img src="img/${esc(it.img)}" alt="${esc(it.name)} 판매자 사진" loading="lazy"></div>`
    : `<div class="pic hold"><b>판매자 사진 자리</b><span>${esc(it.name)}</span></div>`;
  const r = RATE[it.n];
  const rate = r ? `<p class="rate">쿠팡 별점 ${r[0]}, 리뷰 ${Number(r[1]).toLocaleString("ko-KR")}개(${RATE_DAY} 기준)</p>` : "";
  const info = `${pic}<p class="title">${esc(it.title)}</p>${it.why ? `<p class="why">${esc(it.why)}</p>` : ""}${rate}<p class="name">${esc(it.name)}</p>`;
  const goods = live ? `<a class="goods" href="${esc(it.link)}" target="_blank" rel="noopener">${info}</a>` : `<div class="goods">${info}</div>`;
  const btn = live ? `<a class="buy" href="${esc(it.link)}" target="_blank" rel="noopener">쿠팡에서 오늘 값 보기 ›</a>`
                   : `<span class="buy empty">[쿠팡 링크 자리]</span>`;
  const ep = it.ep || it.sec;
  return `<article class="item" id="n${it.n}"><div class="top">${nums.map(a => `<span class="num">${a}번</span>`).join("")}${ep ? `<span class="ep">${esc(ep)}</span>` : ""}<span class="found">찾으시던 물건이에요</span></div>`
       + `${it.scene ? `<p class="scene">${esc(it.scene)}</p>` : ""}${goods}${btn}</article>`;
}
document.getElementById("app").innerHTML = h;
document.getElementById("nums").innerHTML = chips.sort((a, b) => a - b).map(a => `<button type="button" data-n="${a}">${a}번</button>`).join("");
const msg = document.getElementById("msg");
function go(n) {
  n = Number(n);
  if (later[n]) { msg.textContent = `${n}번 물건은 곧 올라와요.`; return false; }
  const el = alias[n] && document.getElementById("n" + alias[n]);
  if (!el) { msg.textContent = "그 번호는 아직 없어요. 번호를 다시 봐 주세요."; return false; }
  msg.textContent = "";
  window.scrollTo({top: el.getBoundingClientRect().top + window.scrollY - 24, behavior:"smooth"}); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 4000);
  return true;
}
document.getElementById("nums").addEventListener("click", e => { const b = e.target.closest("button"); if (b) go(b.dataset.n); });
const hashGo = () => { const m = location.hash.match(/^#n?(\d+)$/); if (m) setTimeout(() => go(m[1]), 300); };
window.addEventListener("hashchange", hashGo); hashGo();
</script>
</body>
</html>
